name: Bug report
description: A guard function raised an unexpected error or returned the wrong data
title: "Bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Before you paste anything, remove API keys,
        tokens, personal data, internal host names and absolute file paths.
  - type: input
    id: version
    attributes:
      label: structured-guard version
      description: The output of python -c "import structured_guard; print(structured_guard.__version__)"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Python version and operating system
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you call, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: The smallest code and payload that show the problem.
      render: python
    validations:
      required: true
