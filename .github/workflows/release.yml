name: release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: build the distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check that the release tag matches the package version
        run: |
          python - <<'PY'
          import os
          import re
          import sys

          text = open("pyproject.toml", encoding="utf-8").read()
          version = re.search(r'^version = "([^"]+)"$', text, re.M).group(1)
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != "v" + version:
              sys.exit("tag " + tag + " does not match version " + version)
          print("tag " + tag + " matches version " + version)
          PY
      - name: Run the offline test suite
        run: |
          python -m pip install "pytest>=7.0.0"
          python -m pytest -q
      - name: Build the source distribution and the wheel
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
